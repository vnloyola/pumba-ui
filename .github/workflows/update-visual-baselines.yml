name: Update visual baselines

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  generate:
    name: Generate
    if: >-
      github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - run: pnpm --filter @pumba-ui/storybook exec playwright install --with-deps chromium
      - run: rm -rf apps/storybook/visual/stories.visual.ts-snapshots
      - run: pnpm --filter @pumba-ui/storybook exec playwright test --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/storybook/visual/stories.visual.ts-snapshots/**/*.png
          if-no-files-found: error
          retention-days: 1
