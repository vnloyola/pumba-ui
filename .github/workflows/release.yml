name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Tag the 0.x baseline before the first release
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD)"
            git push origin v0.0.0
          fi
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # TODO: remove NODE_AUTH_TOKEN once trusted publishing is configured for both packages (VIT-35)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
