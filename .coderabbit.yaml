language: en-US
reviews:
  auto_review:
    base_branches:
      - dev
      - main
  path_filters:
    - "!**/dist/**"
    - "!**/storybook-static/**"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "packages/ui/src/**"
      instructions: >-
        Check against docs/api-conventions.md and CLAUDE.md. Flag missing `render` support and
        compound parts that do not follow section 6. Lint and check:package already enforce Base UI
        types, primitive tokens, lucide-react imports and .js extensions, so do not repeat those.
        Do not ask for comments, JSDoc or features no consumer needs.
    - path: "packages/tokens/**"
      instructions: >-
        Flag renamed or removed tokens (major change) and text/background pairs that may break
        WCAG AA contrast. Do not ask for comments.
